workflows:
  ios-production:
    name: iOS Production (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-asc
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Generate native iOS project (expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Set up code signing (regenerate with Push capability)
        script: |
          keychain initialize

          # Apple Developer Portal でバンドルIDの Push Notifications capability を有効化
          # (expo-notifications が aps-environment entitlement を要求するため)
          BUNDLE_ID_RESOURCE=$(app-store-connect bundle-ids list \
            --bundle-id-identifier com.shoasano.scheduleapp \
            --json 2>/dev/null | jq -r '.[0].id // empty')

          if [ -n "$BUNDLE_ID_RESOURCE" ]; then
            echo "Enabling PUSH_NOTIFICATIONS on bundle ID $BUNDLE_ID_RESOURCE"
            app-store-connect bundle-ids enable-capabilities \
              "$BUNDLE_ID_RESOURCE" \
              PUSH_NOTIFICATIONS || echo "Capability may already be enabled"
          fi

          # 既存の App Store プロファイルを削除し、最新 capability で再作成させる
          PROFILE_IDS=$(app-store-connect profiles list \
            --bundle-id-identifier com.shoasano.scheduleapp \
            --json 2>/dev/null \
            | jq -r '.[] | select(.attributes.profileType == "IOS_APP_STORE") | .id')

          for PROFILE_ID in $PROFILE_IDS; do
            echo "Deleting profile $PROFILE_ID"
            app-store-connect profiles delete "$PROFILE_ID" || true
          done

          app-store-connect fetch-signing-files \
            com.shoasano.scheduleapp \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for App Store
        script: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -type d | head -1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          xcode-project build-ipa \
            --workspace "$WORKSPACE_PATH" \
            --scheme "$SCHEME_NAME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
