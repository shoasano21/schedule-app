workflows:
  ios-production:
    name: iOS Production (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-asc
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Generate native iOS project (expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Strip aps-environment entitlement (we only use local notifications)
        script: |
          set -e
          ENTITLEMENTS_FILE=$(find ios -name "*.entitlements" | head -1)
          echo "Found entitlements file: $ENTITLEMENTS_FILE"
          if [ -n "$ENTITLEMENTS_FILE" ]; then
            echo "--- before ---"
            cat "$ENTITLEMENTS_FILE"
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENTITLEMENTS_FILE" 2>/dev/null || true
            echo "--- after ---"
            cat "$ENTITLEMENTS_FILE"
          fi
      - name: Set up code signing (revoke EAS cert, create fresh)
        script: |
          set -e
          keychain initialize

          # EAS が以前作った Distribution Certificate (秘密鍵が無い) を revoke。
          # こうしないと fetch-signing-files が既存certを取りに行って
          # "Cannot save Signing Certificates without certificate private key" になる。
          echo "--- existing distribution certificates ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION --json || true

          CERT_IDS=$(app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --json 2>/dev/null | jq -r '.[].id // empty')

          for CERT_ID in $CERT_IDS; do
            echo "Deleting distribution certificate $CERT_ID"
            app-store-connect certificates delete "$CERT_ID" --ignore-not-found || true
          done

          # 既存 App Store プロファイルも revoke 後に無効になるので削除
          PROFILE_IDS=$(app-store-connect profiles list \
            --bundle-id-identifier com.shoasano.scheduleapp \
            --json 2>/dev/null \
            | jq -r '.[] | select(.attributes.profileType == "IOS_APP_STORE") | .id')
          for PROFILE_ID in $PROFILE_IDS; do
            echo "Deleting profile $PROFILE_ID"
            app-store-connect profiles delete "$PROFILE_ID" || true
          done

          # フレッシュな cert + profile を作成
          app-store-connect fetch-signing-files \
            com.shoasano.scheduleapp \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

          echo "--- installed profiles ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
      - name: Set build number
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for App Store
        script: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -type d | head -1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          xcode-project build-ipa \
            --workspace "$WORKSPACE_PATH" \
            --scheme "$SCHEME_NAME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
