workflows:
  ios-production:
    name: iOS Production (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-asc
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Generate native iOS project (expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Strip aps-environment entitlement (we only use local notifications)
        script: |
          set -e
          for ENT in $(find ios -name "*.entitlements"); do
            echo "--- $ENT ---"
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENT" 2>/dev/null || true
            cat "$ENT"
          done
      - name: Set up code signing (delete EAS cert, create fresh with explicit key)
        script: |
          set -e
          keychain initialize

          # Step 1: Apple Distribution Certificate (DISTRIBUTION + IOS_DISTRIBUTION) を全削除
          # 秘密鍵が無い既存certを残すと fetch-signing-files が409エラーになる
          for CERT_TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            CERT_IDS=$(app-store-connect certificates list \
              --type "$CERT_TYPE" \
              --json 2>/dev/null | jq -r '.[].id // empty')
            for CERT_ID in $CERT_IDS; do
              echo "Deleting $CERT_TYPE certificate $CERT_ID"
              app-store-connect certificates delete "$CERT_ID" --ignore-not-found || true
            done
          done

          # Step 2: 既存 App Store プロファイルを削除 (メイン + ウィジェット)
          for BUNDLE in com.shoasano.scheduleapp com.shoasano.scheduleapp.widget; do
            PROFILE_IDS=$(app-store-connect profiles list \
              --bundle-id-identifier "$BUNDLE" \
              --json 2>/dev/null \
              | jq -r '.[] | select(.attributes.profileType == "IOS_APP_STORE") | .id')
            for PROFILE_ID in $PROFILE_IDS; do
              echo "Deleting profile $PROFILE_ID for $BUNDLE"
              app-store-connect profiles delete "$PROFILE_ID" --ignore-not-found || true
            done
          done

          # Step 3: Apple API の eventual consistency 対応
          echo "Waiting for Apple API to propagate deletions..."
          sleep 15

          # Step 4: 削除後の状態を確認 (両タイプ)
          echo "--- DISTRIBUTION certs after deletion ---"
          app-store-connect certificates list --type DISTRIBUTION --json || true
          echo "--- IOS_DISTRIBUTION certs after deletion ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION --json || true

          # Step 5: 明示的に秘密鍵を生成
          openssl genrsa -out /tmp/cert_private_key.pem 2048

          # Step 6: 新規 cert + profile 作成（メインアプリ）
          app-store-connect fetch-signing-files \
            com.shoasano.scheduleapp \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem

          # Step 7: ウィジェット拡張ターゲットの cert + profile 作成
          # @bacons/apple-targets が widget の bundle id を <main>.widget で生成する
          app-store-connect fetch-signing-files \
            com.shoasano.scheduleapp.widget \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem

          keychain add-certificates
          xcode-project use-profiles

          echo "--- installed profiles ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
      - name: Set build number
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for App Store
        script: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -type d | head -1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          xcode-project build-ipa \
            --workspace "$WORKSPACE_PATH" \
            --scheme "$SCHEME_NAME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
